name: Metrics

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.plugin.isocalendar.fullyear.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: none
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.plugin.achievements.svg
          base: ""
          plugin_achievements: yes
          output_action: none
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.plugin.notable.svg
          base: ""
          plugin_notable: yes
          output_action: none
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.plugin.habits.charts.svg
          base: ""
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          config_timezone: Asia/Manila
          output_action: none
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.plugin.people.svg
          base: ""
          plugin_people: yes
          plugin_people_types: followers
          plugin_people_limit: 24
          output_action: none
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.plugin.reactions.svg
          base: ""
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: percentage
          output_action: none
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.plugin.discussions.svg
          base: ""
          plugin_discussions: yes
          plugin_discussions_categories_limit: 8
          output_action: none
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.plugin.introduction.svg
          base: ""
          plugin_introduction: yes
          output_action: none
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.plugin.languages.svg
          base: ""
          plugin_languages: yes
          output_action: none
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.plugin.poopmap.svg
          base: ""
          plugin_poopmap: yes
          plugin_poopmap_token: ${{ secrets.POOPMAP_TOKEN }}
          output_action: none
      - name: Copy renders and generate dark variants
        run: |
          cp /metrics_renders/*.svg .
          node .github/scripts/darken-metrics.mjs
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: update metrics"; then
            git push
          fi

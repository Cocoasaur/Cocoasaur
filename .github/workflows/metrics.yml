name: Update GitHub metrics

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    env:
      # Job-level env is the only way to test a secret in an `if:` condition.
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # Metrics queries account-level data that the repository-scoped GITHUB_TOKEN
      # cannot access. Fail early when the user token is unavailable.
      - name: Check METRICS_TOKEN
        if: ${{ env.METRICS_TOKEN == '' }}
        run: |
          echo "::error::METRICS_TOKEN secret is required to generate account metrics"
          exit 1

      # Base account card: header, community, and repository statistics.
      # Exact maintenance-fork revision: includes current GitHub API compatibility fixes.
      - uses: gh-metrics/metrics@4bec7bde733c1dd3c5139ce2146d94a34ae62096
        with:
          token: ${{ env.METRICS_TOKEN }}
          filename: metrics.base.svg
          base: header, community, repositories
          output_action: none
          plugins_errors_fatal: yes

      - uses: gh-metrics/metrics@4bec7bde733c1dd3c5139ce2146d94a34ae62096
        with:
          token: ${{ env.METRICS_TOKEN }}
          filename: metrics.plugin.isocalendar.fullyear.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: none
          plugins_errors_fatal: yes

      # Language analysis reads the token owner's events, so it needs the user token.
      - uses: gh-metrics/metrics@4bec7bde733c1dd3c5139ce2146d94a34ae62096
        with:
          token: ${{ env.METRICS_TOKEN }}
          filename: metrics.plugin.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          output_action: none
          plugins_errors_fatal: yes

      - uses: gh-metrics/metrics@4bec7bde733c1dd3c5139ce2146d94a34ae62096
        with:
          token: ${{ env.METRICS_TOKEN }}
          filename: metrics.plugin.stars.svg
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 4
          output_action: none
          plugins_errors_fatal: yes

      - uses: gh-metrics/metrics@4bec7bde733c1dd3c5139ce2146d94a34ae62096
        with:
          token: ${{ env.METRICS_TOKEN }}
          filename: metrics.plugin.habits.svg
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_from: 200
          config_timezone: Asia/Manila
          output_action: none
          plugins_errors_fatal: yes

      - uses: gh-metrics/metrics@4bec7bde733c1dd3c5139ce2146d94a34ae62096
        with:
          token: ${{ env.METRICS_TOKEN }}
          filename: metrics.plugin.people.svg
          base: ""
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 24
          output_action: none
          plugins_errors_fatal: yes

      - uses: gh-metrics/metrics@4bec7bde733c1dd3c5139ce2146d94a34ae62096
        with:
          token: ${{ env.METRICS_TOKEN }}
          filename: metrics.plugin.reactions.svg
          base: ""
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: percentage
          output_action: none
          plugins_errors_fatal: yes

      - uses: gh-metrics/metrics@4bec7bde733c1dd3c5139ce2146d94a34ae62096
        with:
          token: ${{ env.METRICS_TOKEN }}
          filename: metrics.plugin.repositories.svg
          base: ""
          plugin_repositories: yes
          plugin_repositories_pinned: 4
          output_action: none
          plugins_errors_fatal: yes

      # X includes locked badges, so the card is informative even before an achievement is unlocked.
      - uses: gh-metrics/metrics@4bec7bde733c1dd3c5139ce2146d94a34ae62096
        with:
          # A user token permits the Gist query GitHub blocks for the Actions integration.
          token: ${{ env.METRICS_TOKEN }}
          filename: metrics.plugin.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: X
          output_action: none
          plugins_errors_fatal: yes

      - uses: gh-metrics/metrics@4bec7bde733c1dd3c5139ce2146d94a34ae62096
        with:
          token: ${{ env.METRICS_TOKEN }}
          filename: metrics.plugin.activity.svg
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_timestamps: yes
          output_action: none
          plugins_errors_fatal: yes

      - uses: gh-metrics/metrics@4bec7bde733c1dd3c5139ce2146d94a34ae62096
        with:
          # Repository traffic requires a user token.
          token: ${{ env.METRICS_TOKEN }}
          filename: metrics.plugin.traffic.svg
          base: repositories
          plugin_traffic: yes
          output_action: none
          plugins_errors_fatal: yes

      - name: Copy renders and generate dark variants
        run: |
          cp /metrics_renders/*.svg .
          node .github/scripts/darken-metrics.mjs

      - name: Commit and push updated metrics
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: update metrics"; then
            git push
          fi
